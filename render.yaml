services:
  - type: web
    name: zipchatgo-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: sys
      - key: AI_SERVER_BASE_URL
        sync: false
      - key: MOLIT_SERVICE_KEY
        sync: false
      - key: DEFAULT_LAWD_CD
        value: "41117"
      - key: NAVER_MAPS_CLIENT_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false

  - type: web
    name: zipchatgo-ai
    runtime: python
    rootDir: ai-server
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: SPRING_SERVER_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LAW_API_OC
        sync: false
      - key: LAW_VECTOR_STORE_ID
        sync: false
