name: Build and deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./gradlew build --no-daemon

      - name: Build Docker image
        if: github.event_name == 'push'
        run: docker build --tag homepick:${GITHUB_SHA} .

      - name: Save Docker image
        if: github.event_name == 'push'
        run: docker save homepick:${GITHUB_SHA} --output homepick-image.tar

      - name: Make Docker image readable for upload
        if: github.event_name == 'push'
        run: chmod 644 homepick-image.tar

      - name: Upload Docker image to EC2
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: homepick-image.tar
          target: /tmp
          timeout: 120s

      - name: Deploy on EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_STORAGE_BUCKET: ${{ secrets.FIREBASE_WEB_STORAGE_BUCKET }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,DB_HOST,DB_PORT,DB_DATABASE,DB_USERNAME,DB_PASSWORD,FIREBASE_WEB_API_KEY,FIREBASE_WEB_AUTH_DOMAIN,FIREBASE_WEB_PROJECT_ID,FIREBASE_WEB_STORAGE_BUCKET,FIREBASE_WEB_MESSAGING_SENDER_ID,FIREBASE_WEB_APP_ID
          script: |
            set -eu
            docker load --input /tmp/homepick-image.tar
            docker stop homepick || true
            docker rm homepick || true
            docker run --detach \
              --name homepick \
              --restart unless-stopped \
              --publish 8080:8080 \
              --env DB_HOST="$DB_HOST" \
              --env DB_PORT="$DB_PORT" \
              --env DB_DATABASE="$DB_DATABASE" \
              --env DB_USERNAME="$DB_USERNAME" \
              --env DB_PASSWORD="$DB_PASSWORD" \
              --env FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
              --env FIREBASE_WEB_AUTH_DOMAIN="$FIREBASE_WEB_AUTH_DOMAIN" \
              --env FIREBASE_WEB_PROJECT_ID="$FIREBASE_WEB_PROJECT_ID" \
              --env FIREBASE_WEB_STORAGE_BUCKET="$FIREBASE_WEB_STORAGE_BUCKET" \
              --env FIREBASE_WEB_MESSAGING_SENDER_ID="$FIREBASE_WEB_MESSAGING_SENDER_ID" \
              --env FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
              "homepick:$IMAGE_TAG"
            for attempt in $(seq 1 12); do
              if [ "$(docker inspect --format='{{.State.Running}}' homepick)" = "true" ]; then
                break
              fi
              sleep 5
            done
            if [ "$(docker inspect --format='{{.State.Running}}' homepick)" != "true" ]; then
              docker logs homepick
              exit 1
            fi
            docker ps --filter name=homepick
            rm -f /tmp/homepick-image.tar
