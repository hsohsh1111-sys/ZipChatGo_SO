name: Build and deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ec2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Spring Boot application
        run: ./gradlew --no-daemon bootJar -x test

      - name: Verify deployment configuration
        run: docker compose config --quiet
        env:
          DB_HOST: ci-placeholder
          DB_PORT: '4000'
          DB_DATABASE: housepick
          DB_USERNAME: ci-placeholder
          DB_PASSWORD: ci-placeholder
          INTERNAL_API_KEY: ci-placeholder

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy on EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          envs: APP_DIR,DEPLOY_SHA
          command_timeout: 12m
          script: |
            set -eu
            APP_DIR="${APP_DIR:-/opt/zipchatgo}"
            cd "$APP_DIR"
            test -z "$(git status --porcelain)"
            git fetch --no-tags origin main
            PREVIOUS_SHA=$(git rev-parse HEAD)
            git checkout --quiet main
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            test -f .env
            docker compose config --quiet
            if ! docker compose build; then
              docker compose logs --tail=200 spring ai-server || true
              exit 1
            fi
            if ! docker compose up -d --remove-orphans; then
              git checkout --quiet --detach "$PREVIOUS_SHA"
              docker compose up -d --build --remove-orphans || docker compose logs --tail=200 spring ai-server || true
              git checkout --quiet main
              exit 1
            fi
            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null; then
                docker compose ps
                exit 0
              fi
              sleep 5
            done
            docker compose ps
            docker compose logs --tail=200 spring ai-server
            git checkout --quiet --detach "$PREVIOUS_SHA"
            docker compose up -d --build --remove-orphans || docker compose logs --tail=200 spring ai-server || true
            git checkout --quiet main
            exit 1
