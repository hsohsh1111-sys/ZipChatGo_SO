spring.application.name=zipchatgo
spring.config.import=optional:file:.env[.properties]

# Thymeleaf 캐시 끄기 (저장 후 F5 새로고침 시 즉시 반영)
spring.thymeleaf.cache=false

# 정적 리소스(CSS, JS) 캐시 끄기
spring.web.resources.cache.period=0

# DevTools 재시작 및 LiveReload
spring.devtools.restart.enabled=true

# LiveReload 서버 활성화
spring.devtools.livereload.enabled=true



server.port=${PORT:8080}

# AI Server
ai.server.base-url=${AI_SERVER_BASE_URL:http://127.0.0.1:8000}

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:zipchatgo}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never

molit.service-key=${MOLIT_SERVICE_KEY:}
molit.default-region=${DEFAULT_LAWD_CD:41117}
molit.apt-trade-url=${MOLIT_APT_TRADE_URL:https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade}
molit.apt-rent-url=${MOLIT_APT_RENT_URL:https://apis.data.go.kr/1613000/RTMSDataSvcAptRent/getRTMSDataSvcAptRent}

naver.maps.client-key=${NAVER_MAPS_CLIENT_KEY:}

supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:}

# 사진 업로드 용량 설정
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB


# ===== OAuth2 소셜 로그인 =====
# .env에 값이 없는 환경(팀원 PC 등)에서도 앱이 뜨도록 기본값 dummy를 둠
server.forward-headers-strategy=framework

# Google (openid 제외: 일반 OAuth2 방식으로 처리하기 위함)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.google.scope=profile,email

# Naver
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# Kakao (이메일 동의 없음 → profile_nickname만 요청)
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id